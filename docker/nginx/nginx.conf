# =============================================================================
# nginx.conf — reverse proxy DHIS2 ALIMA
#
# Assure : terminaison TLS, compression gzip, en-têtes de sécurité, et un
# dimensionnement des tampons et délais adapté aux requêtes analytiques
# longues et aux téléversements de pièces jointes.
#
# Écoute sur 8080 (HTTP) et 8443 (HTTPS) — cf. commentaire du Dockerfile.
# =============================================================================

# Les workers — les seuls processus exposés au trafic réseau — tournent sous
# l'utilisateur nginx. Seul le maître reste en root, le temps de lire le
# certificat au démarrage (cf. commentaire du Dockerfile).
#
# Sans cette directive, notre nginx.conf remplaçant intégralement celle de
# l'image, les workers auraient repris l'utilisateur compilé par défaut.
user nginx;

pid /var/run/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Répertoires temporaires en tmpfs (racine du conteneur en lecture seule)
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- Compression ---------------------------------------------------------
    # Déterminante pour la réactivité des tableaux de bord : les réponses
    # analytiques DHIS2 sont du JSON volumineux et très compressible.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types
        "application/json;charset=utf-8" application/json
        "application/javascript;charset=utf-8" application/javascript text/javascript
        "application/xml;charset=utf-8" application/xml text/xml
        "text/css;charset=utf-8" text/css
        "text/plain;charset=utf-8" text/plain
        image/svg+xml;

    upstream dhis2 {
        server dhis2:8080;
        keepalive 32;
    }

    # --- HTTP : challenge ACME et redirection vers HTTPS ---------------------
    server {
        listen 8080;
        server_name _;

        # Renouvellement des certificats Let's Encrypt (challenge http-01)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/dhis2/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dhis2/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # Taille maximale des pièces jointes et des imports de métadonnées
        client_max_body_size 50M;

        # --- En-têtes de sécurité --------------------------------------------
        # "always" : les en-têtes sont émis y compris sur les réponses d'erreur.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header Referrer-Policy           same-origin always;

        location / {
            proxy_pass         http://dhis2;
            proxy_redirect     off;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection        "";

            # Les réponses analytiques DHIS2 comportent des en-têtes
            # volumineux : des tampons trop petits produisent des 502
            # intermittents, difficiles à diagnostiquer.
            proxy_buffer_size       128k;
            proxy_buffers         8 128k;
            proxy_busy_buffers_size 256k;

            # Certaines requêtes analytiques et la génération des tables
            # dépassent largement les délais par défaut.
            proxy_connect_timeout 60s;
            proxy_send_timeout    900s;
            proxy_read_timeout    900s;
            send_timeout          900s;

            proxy_cookie_path ~*^/(.*) "/$1; SameSite=Lax";
        }
    }
}
