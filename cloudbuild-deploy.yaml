# =============================================================================
# cloudbuild-deploy.yaml — déploiement d'un tag d'image sur une VM
#
# Déclenchement MANUEL uniquement. On déploie un tag DÉJÀ CONSTRUIT — jamais
# "latest" : un tag mobile rendrait le retour arrière et l'audit impossibles.
#
#   gcloud builds submit --config=cloudbuild-deploy.yaml \
#     --substitutions=_IMAGE_TAG=2.41.9.1.20260814.01.556073b \
#     --project=alima-dhis2-prod
#
# ⚠ PRODUCTION UNIQUEMENT
#   Il n'existe pas d'environnement de test hébergé : la validation se fait en
#   local (docker compose --profile local). Ce pipeline ne déploie donc que sur
#   la VM de production, et il ne doit être lancé qu'après validation locale du
#   tag concerné.
#
# ⚠ APPROBATION MANUELLE
#   Le déclencheur doit avoir l'approbation manuelle activée (Cloud Build →
#   Déclencheurs → Approbation requise). Ce contrôle est porté par le
#   déclencheur et non par ce fichier : personne ne peut le contourner par un
#   commit.
#
# RETOUR ARRIÈRE
#   Relancer ce même déploiement avec le tag précédent. Aucune reconstruction,
#   aucune intervention manuelle sur la VM.
# =============================================================================

substitutions:
  _IMAGE_TAG: ""          # OBLIGATOIRE — tag à déployer
  _AR_HOST: europe-west1-docker.pkg.dev
  _AR_REPO: dhis2-images
  _ZONE: europe-west1-b
  _VM: vm-dhis2-app
  _REMOTE_DIR: /opt/alima/dhis2

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

steps:

  # ── 1. Validation des paramètres ───────────────────────────────────────────
  # Échouer ici, en quelques secondes, plutôt qu'à mi-parcours d'un
  # déploiement à moitié appliqué.
  - id: validate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [ -z "${_IMAGE_TAG}" ] || [ "${_IMAGE_TAG}" = "A_RENSEIGNER" ]; then
          echo "ERREUR : la version à déployer n'a pas été précisée." >&2
          echo "" >&2
          echo "  Depuis la console : Cloud Build → Déclencheurs →" >&2
          echo "    dhis2-deploy-prod → EXÉCUTER, puis renseigner _IMAGE_TAG." >&2
          echo "" >&2
          echo "  En ligne de commande :" >&2
          echo "    --substitutions=_IMAGE_TAG=2.41.9.1.20260814.01.556073b" >&2
          echo "" >&2
          echo "  Tags disponibles :" >&2
          echo "    gcloud artifacts docker images list \\" >&2
          echo "      ${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}/dhis2-core --include-tags" >&2
          exit 1
        fi

        if [ "${_IMAGE_TAG}" = "latest" ]; then
          echo "ERREUR : le déploiement de 'latest' est interdit." >&2
          echo "  Un tag mobile rend le retour arrière et l'audit impossibles." >&2
          exit 1
        fi

        echo "${_VM}" > /workspace/vm.txt

        # Les deux images doivent exister dans le registre avant qu'on touche
        # à la VM.
        #
        # On liste les tags, on ne « describe » pas l'image : describe va aussi
        # chercher les métadonnées de vulnérabilités dans Container Analysis,
        # et échoue sur containeranalysis.occurrences.list — une donnée dont on
        # n'a aucun usage ici. Élargir les droits du compte de service pour la
        # lire aurait été payer un privilège pour un besoin inexistant.
        #
        # La liste des tags répond exactement à la question posée : ce tag
        # existe-t-il ? Elle est réaffichée en cas d'échec, pour avoir la bonne
        # réponse sous les yeux au moment où l'on se trompe.
        BASE="${_AR_HOST}/${PROJECT_ID}/${_AR_REPO}"
        for IMG in dhis2-core dhis2-nginx; do
          echo "Vérification de $${IMG}:${_IMAGE_TAG}..."

          TAGS=$(gcloud artifacts docker images list "$${BASE}/$${IMG}" \
                   --include-tags --format='value(tags)' 2>/workspace/ar-err.txt \
                 | tr ',' '\n' | tr -d ' ' | grep -v '^$$') || true

          if echo "$${TAGS}" | grep -qx "${_IMAGE_TAG}"; then
            echo "  présente"
          else
            echo "" >&2
            echo "ERREUR : $${IMG}:${_IMAGE_TAG} absente du registre." >&2
            echo "" >&2
            if [ -s /workspace/ar-err.txt ]; then
              echo "  Réponse d'Artifact Registry :" >&2
              sed 's/^/    /' /workspace/ar-err.txt >&2
              echo "" >&2
            fi
            echo "  Tags présents pour $${IMG} :" >&2
            echo "$${TAGS}" | sed 's/^/    /' >&2
            exit 1
          fi
        done

        echo "Cible : PRODUCTION — VM ${_VM}"
        echo "Tag à déployer : ${_IMAGE_TAG}"

  # ── 2. Transfert de la configuration sur la VM ─────────────────────────────
  # docker-compose.yml et les scripts d'exploitation sont versionnés : ils
  # sont poussés depuis le dépôt à chaque déploiement, jamais édités sur la VM.
  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    waitFor: [validate]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VM=$(cat /workspace/vm.txt)

        # Vérifier ce qu'on s'apprête à envoyer AVANT de l'envoyer : une archive
        # incomplète ne se voit qu'à l'arrivée, sous forme d'une erreur qui
        # n'en désigne pas la cause.
        echo "Sources à transférer :"
        ls -l docker/docker-compose.yml
        ls -l scripts/

        # Surcharge de palier. Elle n'existe QUE sur les branches migration/*,
        # jamais sur main : sa présence dans les sources est donc, à elle seule,
        # ce qui distingue un palier d'un déploiement de production. Aucun
        # paramètre à renseigner, donc aucun à oublier.
        OVERRIDE=""
        if [ -f docker/docker-compose.override.yml ]; then
          ls -l docker/docker-compose.override.yml
          OVERRIDE="docker/docker-compose.override.yml"
          echo ">>> PALIER DE MIGRATION : surcharge détectée."
        fi

        tar czf /workspace/stack.tar.gz docker/docker-compose.yml $$OVERRIDE scripts

        echo ""
        echo "Contenu de l'archive :"
        tar tzf /workspace/stack.tar.gz | sed 's/^/  /'

        # La mise en place distante part en FICHIER, exécuté par « sudo bash ».
        #
        # Écrite en --command multi-lignes, elle ne se comportait pas comme un
        # script : le « set -euo pipefail » de tête restait sans effet, les
        # échecs de tar et de cp passaient inaperçus, et seul chmod finissait
        # par signaler un symptôme — sans jamais désigner la cause. Un fichier
        # transféré puis exécuté supprime toute ambiguïté sur ce qui tourne, et
        # sur le shell qui l'interprète.
        cat > /workspace/remote-install.sh <<'REMOTE'
        #!/usr/bin/env bash
        set -euo pipefail

        APP_DIR="__REMOTE_DIR__"
        STAGING=/tmp/stack

        echo "--- archive reçue ---"
        ls -l /tmp/stack.tar.gz

        rm -rf "$$STAGING"
        mkdir -p "$$STAGING"
        tar xzf /tmp/stack.tar.gz -C "$$STAGING"

        echo "--- contenu extrait ---"
        find "$$STAGING" -type f | sort

        mkdir -p "$$APP_DIR"
        cp -f "$$STAGING/docker/docker-compose.yml" "$$APP_DIR/docker-compose.yml"

        # Compose charge docker-compose.override.yml DE LUI-MÊME lorsqu'il se
        # trouve à côté du fichier principal. C'est la raison du nom : la
        # surcharge s'applique alors à toute commande lancée depuis ce
        # répertoire — déploiement, wait-healthy, dhis2ctl — sans qu'aucun
        # script n'ait à la connaître. Un -f explicite dans le seul
        # deploy-stack.sh aurait fait diverger le diagnostic du déploiement.
        #
        # ⚠ La branche sans surcharge doit EFFACER celle qui reste. Sans ce
        #   rm, un palier déployé puis suivi d'un retour à main laisserait la
        #   production tourner en read_only:false, silencieusement.
        if [ -f "$$STAGING/docker/docker-compose.override.yml" ]; then
          cp -f "$$STAGING/docker/docker-compose.override.yml"                 "$$APP_DIR/docker-compose.override.yml"
          echo ">>> surcharge de palier installée"
        else
          rm -f "$$APP_DIR/docker-compose.override.yml"
        fi

        # scripts/ est remplacé en entier plutôt que fusionné : un script retiré
        # du dépôt doit disparaître de la VM, sans quoi une version obsolète y
        # survivrait indéfiniment.
        rm -rf "$$APP_DIR/scripts"
        cp -r "$$STAGING/scripts" "$$APP_DIR/scripts"
        chmod +x "$$APP_DIR"/scripts/*.sh

        rm -rf "$$STAGING" /tmp/stack.tar.gz

        echo "--- mis en place ---"
        ls -l "$$APP_DIR"
        ls -l "$$APP_DIR/scripts"
        REMOTE

        sed -i 's|^        ||; s|__REMOTE_DIR__|${_REMOTE_DIR}|' /workspace/remote-install.sh

        gcloud compute scp /workspace/stack.tar.gz /workspace/remote-install.sh \
          "$${VM}:/tmp/" \
          --zone=${_ZONE} --tunnel-through-iap --quiet

        gcloud compute ssh "$${VM}" --zone=${_ZONE} --tunnel-through-iap --quiet \
          --command "sudo bash /tmp/remote-install.sh"

  # ── 3. Génération du .env depuis Secret Manager ────────────────────────────
  # Les secrets ne transitent jamais par ce pipeline : c'est la VM qui les lit
  # elle-même, avec son propre compte de service.
  - id: render-env
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    waitFor: [upload]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VM=$(cat /workspace/vm.txt)

        gcloud compute ssh "$${VM}" --zone=${_ZONE} --tunnel-through-iap --quiet \
          --command "sudo ${_REMOTE_DIR}/scripts/render-env.sh \
                       --tag ${_IMAGE_TAG} \
                       --registry ${_AR_HOST}/${PROJECT_ID}/${_AR_REPO} \
                       --output ${_REMOTE_DIR}/.env"

  # ── 4. Préparation de la base ──────────────────────────────────────────────
  # DHIS2 exige postgis, btree_gin et pg_trgm. Sans elles, le démarrage échoue
  # sur une exception Hibernate qui ne désigne pas la cause.
  #
  # Cette étape est rejouée à chaque déploiement, et non réservée à la première
  # installation : une base restaurée depuis une sauvegarde, ou recréée,
  # retrouve ainsi ses extensions sans que personne ait à y penser. Les
  # « CREATE EXTENSION IF NOT EXISTS » ne coûtent rien quand elles sont déjà là.
  - id: init-db
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    waitFor: [render-env]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VM=$(cat /workspace/vm.txt)

        gcloud compute ssh "$${VM}" --zone=${_ZONE} --tunnel-through-iap --quiet \
          --command "sudo bash ${_REMOTE_DIR}/scripts/init-database.sh ${_REMOTE_DIR}"

  # ── 5. Déploiement ─────────────────────────────────────────────────────────
  # Comme la vérification, le déploiement est porté par un script présent sur la
  # VM, appelé par une commande d'une seule ligne.
  #
  # Le « cd » ne peut pas se faire côté SSH : le répertoire applicatif est en
  # 750 propriété de root — il contient le .env, donc le mot de passe de la base
  # et la clé de chiffrement. C'est le déploiement qui doit passer en root, pas
  # les permissions qui doivent être relâchées.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    waitFor: [init-db]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VM=$(cat /workspace/vm.txt)

        gcloud compute ssh "$${VM}" --zone=${_ZONE} --tunnel-through-iap --quiet \
          --command "sudo bash ${_REMOTE_DIR}/scripts/deploy-stack.sh ${_REMOTE_DIR} ${_AR_HOST}"

  # ── 6. Vérification active ─────────────────────────────────────────────────
  # Un déploiement n'est annoncé réussi qu'après réponse de l'application.
  # Sans cette étape, un conteneur qui redémarre en boucle passerait pour un
  # succès.
  #
  # La boucle d'attente vit dans scripts/wait-healthy.sh et non ici : écrite en
  # ligne, elle exigeait trois niveaux d'échappement imbriqués — YAML, shell
  # local, shell distant — et deux défauts s'y étaient glissés : une variable
  # shell prise pour une substitution Cloud Build, et une apostrophe fermant un
  # guillemet trop tôt. Un fichier exécuté tel quel supprime le problème.
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    waitFor: [deploy]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VM=$(cat /workspace/vm.txt)

        gcloud compute ssh "$${VM}" --zone=${_ZONE} --tunnel-through-iap --quiet \
          --command "sudo ${_REMOTE_DIR}/scripts/wait-healthy.sh dhis2 600 ${_REMOTE_DIR}/docker-compose.yml"

        echo ""
        echo "================================================================"
        echo " Déploiement terminé en PRODUCTION — tag ${_IMAGE_TAG}"
        echo ""
        echo " Retour arrière : relancer ce déploiement avec le tag précédent."
        echo "================================================================"

timeout: 3600s
